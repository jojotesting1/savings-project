services:
  - type: web
    name: jk-capital-test
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jk-capital-test-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_CURRENCY
        value: EUR

databases:
  - name: jk-capital-test-db
    plan: basic-256mb
    databaseName: jkcapital
    user: jkcapital_user
